name: IronScheme

on:
  push:
    branches: [ "master", "beta" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    timeout-minutes: 40

    defaults:
      run:
        working-directory: .

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install ILVerify
      run: dotnet tool install -g dotnet-ilverify

    - name: Check C# formatting
      if: matrix.os == 'ubuntu-latest'
      run: dotnet format IronScheme.slnx --verify-no-changes --severity warning

    - name: Build and test
      run: dotnet test
